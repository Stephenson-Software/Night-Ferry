name: Run Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov -r requirements.txt

    - name: Run tests with coverage
      run: |
        python -m pytest --verbose -vv --cov=src --cov-report=term-missing --cov-report=xml:cov.xml

    - name: The browser bundle builds
      run: |
        python3 web/build_zip.py
        python3 -c "import zipfile; n=set(zipfile.ZipFile('web/game.zip').namelist()); assert 'src/nightferry/game.py' in n and 'src/tak/ui/pyodide.py' in n and 'schemas/save.json' in n and 'web/pyodide_main.py' in n, n"

  # Night Ferry ships no Dockerfile - arcade hosts the browser build - so
  # where Overwinter checks its image, this checks the kit's own server: the
  # page, the bundle and the tak assets come back with the isolation headers
  # Pyodide needs.
  serve:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: The served page carries the isolation headers
      run: |
        python3 web/build_zip.py
        python3 web/serve.py > serve.log 2>&1 &
        sleep 3
        curl -fsSI http://127.0.0.1:8080/ | tee headers.txt
        grep -qi 'Cross-Origin-Embedder-Policy: require-corp' headers.txt
        curl -fsS http://127.0.0.1:8080/ | grep -q '<title>Night Ferry</title>'
        curl -fsS http://127.0.0.1:8080/tak/client.js | grep -q TakClient
        curl -fsSI http://127.0.0.1:8080/web/game.zip | grep -q '200'
